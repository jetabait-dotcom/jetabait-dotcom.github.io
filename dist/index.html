<!doctype html>
<html lang="th" class="auth-pending">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111313"><meta name="description" content="Jetaboard พื้นที่เริ่มต้น ดูเวลา เปิดเว็บโปรด และเข้าคลัง Jetawatch"><title>Jetaboard — พื้นที่ของคุณ</title><link rel="modulepreload" href="vendor/supabase.js"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="login.css"><link rel="stylesheet" href="board.css"><script defer src="config.js"></script><script defer src="account.js"></script><script defer src="account-menu.js"></script><script defer src="board.js"></script></head>
<body class="board"><div class="auth-transition" role="status"><span class="transition-brand">Jetaboard<span>✳</span></span><p>กำลังเตรียมพื้นที่ของคุณ…</p><a href="/account.html">ลองเข้าสู่ระบบอีกครั้ง</a></div><noscript><p>กรุณาเปิด JavaScript เพื่อดูนาฬิกาและใช้ Dashboard</p></noscript>
<div class="board-shell">
<main>
<section class="board-featured" aria-label="เวลาประเทศไทย"><article class="clock-card"><div class="clock-top"><span>เวลาตอนนี้</span><span>BANGKOK · TH</span></div><div class="clock-time" role="timer" aria-label="เวลาปัจจุบันประเทศไทย"><span id="clock-hours">--:--</span><small id="clock-seconds">--</small></div><div id="clock-date" class="clock-date"></div><div class="clock-foot"><span>ASIA / BANGKOK</span><span>UTC +07:00</span></div></article>
</section>
<section aria-labelledby="shortcuts-title"><div class="shortcuts-heading"><h2 id="shortcuts-title">เว็บที่ใช้บ่อย <small>SHORTCUTS / <span id="shortcut-count">08</span></small></h2><button type="button" class="board-add" id="add-shortcut">＋ เพิ่ม shortcut</button></div><div class="shortcut-grid" id="shortcut-grid"></div><p id="board-notice" class="board-notice" role="status"></p></section></main>
<div class="board-footer"><span>A LITTLE SPACE, ALL YOURS.</span><span>SHORTCUTS บันทึกในเบราว์เซอร์นี้</span></div></div>
<dialog class="board-dialog" id="shortcut-dialog" aria-labelledby="shortcut-dialog-title"><form id="shortcut-form"><h2 id="shortcut-dialog-title">เพิ่มเว็บโปรด</h2><label>ชื่อเว็บ<input id="shortcut-name" required maxlength="40" placeholder="เช่น เว็บที่ใช้ทุกวัน" autocomplete="off"></label><label>ลิงก์เว็บไซต์<input id="shortcut-url" type="text" inputmode="url" required maxlength="2048" placeholder="https://example.com" autocomplete="url"></label><p>เว็บภายนอกจะเปิดในแท็บใหม่</p><p id="shortcut-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-shortcut">ยกเลิก</button><button type="submit">เพิ่ม shortcut</button></div></form></dialog>
</body></html>
